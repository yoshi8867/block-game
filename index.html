<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Block Game</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#150a2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="assets/icon-192.png">

<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/ui.css">
</head>
<body>

<div id="stage">
  <div id="score-pill">
    <span id="score-coin">h</span>
    <span id="score">0</span>
  </div>

  <div id="clock"></div>

  <div id="gauge">
    <div id="gauge-fill"></div>
  </div>

  <div id="board-frame"></div>
  <div id="board">
  <!-- 원작 실측: 짙은 와인빛 빨강 + 두꺼운 남색 외곽선 + 윗부분 회색 광택.
       textLength 로 폭을 고정해 폰트가 뭐든 원작 비율(가로 640 / 캡높이 88)을 지킨다. -->
  <svg id="over-title" viewBox="0 0 660 130" aria-label="GAME OVER">
    <defs>
      <linearGradient id="go-fill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#9C1B3F"/>
        <stop offset=".55" stop-color="#8B1233"/>
        <stop offset="1" stop-color="#6C0B27"/>
      </linearGradient>
      <clipPath id="go-clip">
        <text x="330" y="106" textLength="620" lengthAdjust="spacingAndGlyphs">GAME OVER</text>
      </clipPath>
      <!-- 원작 광택은 글자마다 놓인 짧은 막대다. 글자 간격(620/9)마다 반복시켜
           글자에 걸리는 부분만 보이게 한다. -->
      <pattern id="go-gloss" x="26" width="68.9" height="130" patternUnits="userSpaceOnUse">
        <rect y="33" width="30" height="10" rx="5" fill="#C9CBD8"/>
      </pattern>
    </defs>
    <text x="330" y="106" textLength="620" lengthAdjust="spacingAndGlyphs"
          stroke="#100628" stroke-width="15" paint-order="stroke"
          fill="url(#go-fill)">GAME OVER</text>
    <g clip-path="url(#go-clip)">
      <rect width="660" height="130" fill="url(#go-gloss)" opacity=".62"/>
    </g>
  </svg>
</div>

  <div class="slot" data-slot="0"></div>
  <div class="slot" data-slot="1"></div>
  <div class="slot" data-slot="2"></div>

  <button id="block-change" type="button" aria-label="block change"></button>

  <!-- ponytail: 테스트용. 판정 튜닝 끝나면 이 블록과 #devbar CSS·JS 를 지운다 -->
<div id="devbar">
  <button id="dev-pull" type="button">PULL ON</button>
  <button id="dev-clear" type="button">CLEAR</button>
  <button id="dev-fx" type="button">FX</button>
  <button id="dev-low" type="button">LOW</button>
  <button id="dev-end" type="button">END</button>
</div>

<div id="drag-layer"></div>
  <div id="flash"></div>
<div id="banner"></div>

<button id="retry" type="button" aria-label="retry"></button>

  <div id="start">
    <div id="start-title">BLOCK</div>
    <div id="start-tap">TAP TO START</div>
  </div>
</div>

<script src="js/blocks.js"></script>
<script src="js/board.js"></script>
<script src="js/render.js"></script>
<script src="js/drag.js"></script>
<script src="js/fx.js"></script>
<script src="js/audio.js"></script>
<script src="js/main.js"></script>
</body>
</html>
