<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Block Game</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#150a2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="assets/icon-192.png">

<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/ui.css">
</head>
<body>

<div id="stage">
  <div id="score-pill">
    <span id="score-coin">h</span>
    <span id="score">0</span>
  </div>

  <div id="clock"></div>

  <div id="gauge">
    <div id="gauge-fill"></div>
  </div>

  <div id="board-frame"></div>
  <div id="board"></div>

  <div class="slot" data-slot="0"></div>
  <div class="slot" data-slot="1"></div>
  <div class="slot" data-slot="2"></div>

  <button id="block-change" type="button" aria-label="block change"></button>

  <!-- ponytail: 테스트용. 판정 튜닝 끝나면 이 블록과 #devbar CSS·JS 를 지운다 -->
<div id="devbar">
  <button id="dev-pull" type="button">PULL ON</button>
  <button id="dev-clear" type="button">CLEAR</button>
  <button id="dev-fx" type="button">FX</button>
  <button id="dev-low" type="button">LOW</button>
  <button id="dev-end" type="button">END</button>
</div>

<div id="drag-layer"></div>
  <div id="flash"></div>
<div id="banner"></div>

<div id="over">
  <div id="over-title">GAME OVER</div>
  <button id="retry" type="button" aria-label="retry"></button>
</div>

  <div id="start">
    <div id="start-title">BLOCK</div>
    <div id="start-tap">TAP TO START</div>
  </div>
</div>

<script src="js/blocks.js"></script>
<script src="js/board.js"></script>
<script src="js/render.js"></script>
<script src="js/drag.js"></script>
<script src="js/fx.js"></script>
<script src="js/main.js"></script>
</body>
</html>
